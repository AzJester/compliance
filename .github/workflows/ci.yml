name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Lint backend
        run: python -m ruff check backend

      - name: Check backend formatting
        run: python -m ruff format --check backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test:run

      - name: Build frontend
        run: pnpm build

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag dod-rfp-compliance:ci .

      - name: Start production image
        run: |
          docker volume create compliance-ci-data
          docker run --detach \
            --name compliance-ci \
            --publish 127.0.0.1:8000:8000 \
            --mount type=volume,source=compliance-ci-data,target=/var/data \
            --env COMPLIANCE_ALLOWED_ORIGINS=https://compliance.example.test \
            --env COMPLIANCE_TRUSTED_HOSTS=compliance.example.test \
            --env COMPLIANCE_TRUST_PROXY_HEADERS=true \
            --env RENDER=true \
            --env COMPLIANCE_AUTH_USERNAME=ci-reviewer \
            --env COMPLIANCE_AUTH_PASSWORD=ci-only-password-not-a-secret \
            dod-rfp-compliance:ci

      - name: Wait for container health
        run: |
          for attempt in {1..45}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' compliance-ci)"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker logs compliance-ci
              exit 1
            fi
            sleep 1
          done
          docker logs compliance-ci
          exit 1

      - name: Verify web security boundary
        run: |
          test "$(docker inspect --format '{{.Config.User}}' compliance-ci)" = "10001:10001"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/data"}}{{.Type}}:{{.Name}}{{end}}{{end}}' compliance-ci)" = "volume:compliance-ci-data"

          common_args=(
            --silent
            --show-error
            --header "Host: compliance.example.test"
            --header "X-Forwarded-Proto: https"
          )

          health_status="$(curl "${common_args[@]}" --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/health)"
          test "$health_status" = "200"

          denied_status="$(curl "${common_args[@]}" --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/)"
          test "$denied_status" = "401"

          curl "${common_args[@]}" --fail --output /dev/null \
            --user 'ci-reviewer:ci-only-password-not-a-secret' \
            http://127.0.0.1:8000/

          curl "${common_args[@]}" --fail --output /dev/null \
            --user 'ci-reviewer:ci-only-password-not-a-secret' \
            --header "Origin: https://compliance.example.test" \
            --header "Content-Type: application/json" \
            --data '{"name":"Synthetic CI project","sensitivity":"PUBLIC"}' \
            http://127.0.0.1:8000/api/projects

          docker restart compliance-ci
          for attempt in {1..45}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' compliance-ci)"
            if [[ "$status" == "healthy" ]]; then
              break
            fi
            if [[ "$status" == "unhealthy" || "$attempt" == "45" ]]; then
              docker logs compliance-ci
              exit 1
            fi
            sleep 1
          done

          curl "${common_args[@]}" --fail \
            --user 'ci-reviewer:ci-only-password-not-a-secret' \
            http://127.0.0.1:8000/api/projects \
            | grep --fixed-strings 'Synthetic CI project'

      - name: Show logs and remove container
        if: always()
        run: |
          docker logs compliance-ci || true
          docker rm --force compliance-ci || true
          docker volume rm compliance-ci-data || true
