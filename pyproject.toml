[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dod-rfp-compliance"
version = "0.1.0"
description = "Local-first DoD RFP compliance analysis application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.8,<1",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.44,<1",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
compliance-api = "backend.app.main:run"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
